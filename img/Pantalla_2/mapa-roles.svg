<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Mapa visual de roles organizacionales</title>
  <desc id="desc">Ilustracion de una organizacion conectada por roles y objetivos compartidos.</desc>
  <rect width="1200" height="800" rx="32" fill="#eef5f4"/>
  <circle cx="600" cy="400" r="150" fill="#1f4e5f"/>
  <circle cx="600" cy="400" r="102" fill="#4f7c82"/>
  <text x="600" y="385" fill="#fff" font-family="Arial,sans-serif" font-size="31" text-anchor="middle" font-weight="700">PROPOSITO</text>
  <text x="600" y="425" fill="#e7f3f1" font-family="Arial,sans-serif" font-size="23" text-anchor="middle">compartido</text>
  <g stroke="#d9a441" stroke-width="10" stroke-linecap="round">
    <path d="M500 315 275 190"/><path d="M700 315 925 190"/><path d="M500 485 275 610"/><path d="M700 485 925 610"/>
  </g>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g><rect x="105" y="105" width="340" height="155" rx="22" fill="#fff" stroke="#d9a441" stroke-width="5"/><circle cx="170" cy="182" r="28" fill="#d9a441"/><text x="170" y="192" font-size="26" fill="#143440" font-weight="700">01</text><text x="290" y="175" font-size="27" fill="#143440" font-weight="700">Roles</text><text x="290" y="210" font-size="20" fill="#6b7280">claridad y aporte</text></g>
    <g><rect x="755" y="105" width="340" height="155" rx="22" fill="#fff" stroke="#4f7c82" stroke-width="5"/><circle cx="820" cy="182" r="28" fill="#4f7c82"/><text x="820" y="192" font-size="26" fill="#fff" font-weight="700">02</text><text x="940" y="175" font-size="27" fill="#143440" font-weight="700">Equipos</text><text x="940" y="210" font-size="20" fill="#6b7280">coordinacion humana</text></g>
    <g><rect x="105" y="540" width="340" height="155" rx="22" fill="#fff" stroke="#4f7c82" stroke-width="5"/><circle cx="170" cy="617" r="28" fill="#4f7c82"/><text x="170" y="627" font-size="26" fill="#fff" font-weight="700">03</text><text x="290" y="610" font-size="27" fill="#143440" font-weight="700">Cultura</text><text x="290" y="645" font-size="20" fill="#6b7280">confianza y cuidado</text></g>
    <g><rect x="755" y="540" width="340" height="155" rx="22" fill="#fff" stroke="#d9a441" stroke-width="5"/><circle cx="820" cy="617" r="28" fill="#d9a441"/><text x="820" y="627" font-size="26" fill="#143440" font-weight="700">04</text><text x="940" y="610" font-size="27" fill="#143440" font-weight="700">Desempeno</text><text x="940" y="645" font-size="20" fill="#6b7280">retroalimentacion util</text></g>
  </g>
